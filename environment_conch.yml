name: conch

# Conda environment for Steps 08–09 (CONCH H&E feature extraction).
# This environment intentionally pins anndata to 0.11.x.
# Steps 07 and 10 must run in the `g4x_prepro` environment (anndata >= 0.12).
#
# Before creating this environment, download the CONCH model weights:
#   https://huggingface.co/MahmoodLab/CONCH
# Place pytorch_model.bin at:
#   data/CONCH/checkpoints/conch/pytorch_model.bin
#
# Install CONCH package after environment creation:
#   conda activate conch
#   pip install git+https://github.com/mahmoodlab/CONCH.git

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pytorch>=2.0
  - torchvision
  - pytorch-cuda=11.8   # adjust to match your CUDA driver version
  - pip
  - pip:
    - Pillow
    - pandas
    - numpy
    - tqdm
    - "anndata==0.11.4"   # pinned: newer versions write .h5ad the conch env cannot read back
    - scikit-learn
    # Install CONCH separately after environment creation (see above)
    # pip install git+https://github.com/mahmoodlab/CONCH.git
