name: g4x_prepro

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - pip:
    - pandas
    - numpy
    - Pillow
    - matplotlib
    - tifffile
    - "anndata>=0.12.10"  # required by Step 10 (MuData matching)
    - "mudata>=0.3.3"    # required by Step 10
    - scipy
    - scikit-image
    - shapely
    - tqdm
    - opencv-python
    # deepcell requires tensorflow; install tensorflow first so deepcell
    # can find a compatible version
    - tensorflow
    - deepcell
    - pyqupath
    - pycodex
    # Step 05 — RNA & protein preprocessing
    - scanpy
    - seaborn
    - igraph
    - codex_preprocessing
